    const getLevelInfo = (count) => {
      if (count <= 2) return { name: "PEMBICARA PEMULA", range: "0–2 latihan" };
      if (count <= 7) return { name: "PEMBICARA BERKEMBANG", range: "3–7 latihan" };
      if (count <= 15) return { name: "PEMBICARA PERCAYA DIRI", range: "8–15 latihan" };
      if (count <= 30) return { name: "PEMBICARA MAHIR", range: "16–30 latihan" };
      return { name: "MASTER BERBICARA", range: "31+ latihan" };
    };

    const detectFillerWords = (text) => {
      if (!text || typeof text !== 'string') return { total: 0, breakdown: {} };
      const patterns = [
        { label: "Eee", regex: /\b(e{2,}|e)\b/gi },
        { label: "Emm", regex: /\b(em+|ehm+)\b/gi },
        { label: "Hmm", regex: /\b(hm+)\b/gi },
        { label: "Anu", regex: /\b(anu)\b/gi },
        { label: "Apa namanya", regex: /\b(apa\s+namanya)\b/gi }
      ];
      let total = 0;
      const breakdown = {};
      patterns.forEach(item => {
        const matches = text.match(item.regex);
        const count = matches ? matches.length : 0;
        if (count > 0) {
          breakdown[item.label] = count;
          total += count;
        }
      });
      return { total, breakdown };
    };

    const calculateMetrics = (actualSec, targetSec, fillerCount, thinkingMoments, transcript) => {
      const words = transcript ? transcript.trim().split(/\s+/).filter(Boolean).length : 0;
      const completionRatio = Math.min(actualSec / Math.max(targetSec, 1), 1);
      
      let baseScore = completionRatio * 80;
      const wpm = actualSec > 0 ? (words / actualSec) * 60 : 0;
      if (wpm >= 70 && wpm <= 150) baseScore += 15;
      else if (wpm > 30) baseScore += 8;

      const fillerPenalty = Math.min(fillerCount * 2.5, 20);
      const thinkingPenalty = Math.min(thinkingMoments * 3, 15);
      
      let fluencyScore = Math.round(Math.max(25, Math.min(98, baseScore - fillerPenalty - thinkingPenalty + 5)));
      if (actualSec < 15) fluencyScore = Math.min(fluencyScore, 35);

      let confidenceScore = Math.round((fluencyScore * 0.6) + (completionRatio * 35));
      confidenceScore = Math.min(96, Math.max(30, confidenceScore));

      return { fluencyScore, confidenceScore };
    };

    const generateHumanFeedback = (actualSec, targetSec, fluencyScore, fillerCount, thinkingMoments) => {
      const ratio = actualSec / targetSec;
      let feedback = "";
      let nextFocus = "";

      if (ratio >= 0.85) {
        if (fillerCount <= 3 && thinkingMoments <= 2) {
          feedback = "Kamu mampu mempertahankan tempo dan alur pembicaraan dengan sangat tenang. Kalimatmu mengalir terstruktur tanpa banyak hambatan.";
          nextFocus = "Pertahankan konsistensi ini dan cobalah bereksperimen dengan intonasi vokal yang lebih dinamis untuk memperkuat penekanan gagasan penting.";
        } else if (fillerCount > 5) {
          feedback = "Durasimu sangat baik dan idemu terus mengalir. Terkadang kata pengisi muncul ketika kamu sedang mencari kalimat sambungan.";
          nextFocus = "Saat membutuhkan waktu berpikir, gunakan jeda senyap (silent pause) alih-alih mengucapkan 'eee' atau 'emm'. Hening sejenak terdengar jauh lebih berwibawa.";
        } else {
          feedback = "Kamu berhasil berbicara hingga mendekati target waktu. Beberapa jeda berpikir terlihat wajar untuk menyusun poin pikiran.";
          nextFocus = "Latih transisi antar kalimat agar gagasan utamamu tersambung lebih padu dari awal hingga akhir.";
        }
      } else if (ratio >= 0.5) {
        feedback = "Kamu sudah menunjukkan keberanian untuk menyampaikan ide spontan selama lebih dari separuh durasi target. Itu adalah langkah awal yang sangat berharga.";
        nextFocus = "Pada latihan berikutnya, gunakan teknik 3 poin sederhana (Pengantar, Cerita/Argumen, dan Kesimpulan) agar kamu tidak kehabisan materi di tengah jalan.";
      } else {
        feedback = "Memulai berbicara spontan memang menantang. Setiap kata yang kamu ucapkan adalah bentuk latihan melatih keberanian pikiranmu.";
        nextFocus = "Jangan terburu-buru menyelesaikan. Ambil napas perlahan, dan sampaikan contoh sederhana dari pengalaman pribadi saat membahas topik.";
      }

      return { feedback, nextFocus };
    };

    const formatSeconds = (sec) => {
      const m = Math.floor(sec / 60);
      const s = sec % 60;
      return `${String(m).padStart(2, '0')}:${String(s).padStart(2, '0')}`;
    };

    const formatDurationText = (sec) => {
      const m = Math.floor(sec / 60);
      const s = sec % 60;
      if (m > 0 && s > 0) return `${m} menit ${s} detik`;
      if (m > 0) return `${m} menit`;
      return `${s} detik`;
    };

    const formatDateText = (dateStr) => {
      try {
        const d = new Date(dateStr);
        const months = ["Januari", "Februari", "Maret", "April", "Mei", "Juni", "Juli", "Agustus", "September", "Oktober", "November", "Desember"];
        return `${d.getDate()} ${months[d.getMonth()]} ${d.getFullYear()}`;
      } catch (e) {
        return dateStr;
      }
    };

    function App() {
      const [currentTab, setCurrentTab] = useState('BERANDA');
      const [mobileMenuOpen, setMobileMenuOpen] = useState(false);

      const [history, setHistory] = useState([]);
      const [usedTopics, setUsedTopics] = useState([]);
      const [activeSessionNotice, setActiveSessionNotice] = useState(null);

      // Practice State
      const [practiceStep, setPracticeStep] = useState('PREPARE');
      const [currentTopic, setCurrentTopic] = useState('');
      const [shuffleText, setShuffleText] = useState('KEBERANIAN');
      const [thinkingSeconds, setThinkingSeconds] = useState(30);
      const [targetDuration, setTargetDuration] = useState(60);
      const [elapsedSpeakingSeconds, setElapsedSpeakingSeconds] = useState(0);
      const [isSpeakingPaused, setIsSpeakingPaused] = useState(false);
      const [liveTranscript, setLiveTranscript] = useState('');
      const [micError, setMicError] = useState(null);
      const [speechSupported, setSpeechSupported] = useState(true);
      const [thinkingMomentsCount, setThinkingMomentsCount] = useState(0);

      const [latestResult, setLatestResult] = useState(null);
      const [selectedHistoryItem, setSelectedHistoryItem] = useState(null);
      const [showDeleteModal, setShowDeleteModal] = useState(false);

      // Refs
      const audioContextRef = useRef(null);
      const analyserRef = useRef(null);
      const micStreamRef = useRef(null);
      const animationFrameRef = useRef(null);
      const canvasRef = useRef(null);
      const recognitionRef = useRef(null);
      const lastSpeechTimeRef = useRef(Date.now());
      const thinkingTimerRef = useRef(null);

      useEffect(() => {
        setHistory(getStoredHistory());
        setUsedTopics(getStoredUsedTopics());
        const SpeechRec = window.SpeechRecognition || window.webkitSpeechRecognition;
        if (!SpeechRec) setSpeechSupported(false);

        const savedActive = getActiveSession();
        if (savedActive && savedActive.topic) setActiveSessionNotice(savedActive);
      }, []);

      useEffect(() => {
        if (window.lucide) {
          window.lucide.createIcons();
        }
      });

      const handleUpdateHistory = (newH) => {
        setHistory(newH);
        saveStoredHistory(newH);
      };

      const dashboardStats = useMemo(() => {
        const totalPractices = history.length;
        if (totalPractices === 0) {
          return {
            totalPractices: 0,
            totalMinutes: 0,
            avgFluency: '—',
            avgFillers: '—',
            confidenceScore: '—',
            level: getLevelInfo(0)
          };
        }
        const totalSeconds = history.reduce((acc, curr) => acc + (curr.actualDuration || 0), 0);
        const totalMinutes = Math.round(totalSeconds / 60);
        const totalFluency = history.reduce((acc, curr) => acc + (curr.fluencyScore || 0), 0);
        const avgFluency = Math.round(totalFluency / totalPractices) + '%';
        const totalFillers = history.reduce((acc, curr) => acc + (curr.fillerCount || 0), 0);
        const avgFillers = (totalFillers / totalPractices).toFixed(1);

        const recent = history.slice(0, 5);
        const recentConfidence = Math.round(
          recent.reduce((acc, curr) => acc + (curr.confidenceScore || 50), 0) / recent.length
        );

        return {
          totalPractices,
          totalMinutes,
          avgFluency,
          avgFillers,
          confidenceScore: recentConfidence + '%',
          level: getLevelInfo(totalPractices)
        };
      }, [history]);

      const startTopicShuffle = () => {
        setPracticeStep('SHUFFLING');
        setMicError(null);

        let available = TOPIC_DATABASE.filter(t => !usedTopics.includes(t));
        if (available.length === 0) {
          available = [...TOPIC_DATABASE];
          setUsedTopics([]);
          saveStoredUsedTopics([]);
        }

        const chosen = available[Math.floor(Math.random() * available.length)];
        let counter = 0;
        const interval = setInterval(() => {
          counter++;
          const randT = TOPIC_DATABASE[Math.floor(Math.random() * TOPIC_DATABASE.length)];
          setShuffleText(randT.toUpperCase());

          if (counter >= 22) {
            clearInterval(interval);
            setShuffleText(chosen.toUpperCase());
            setCurrentTopic(chosen);

            const newUsed = [...usedTopics, chosen];
            setUsedTopics(newUsed);
            saveStoredUsedTopics(newUsed);

            setTimeout(() => {
              setThinkingSeconds(30);
              setPracticeStep('THINKING');
            }, 600);
          }
        }, 65);
      };

      useEffect(() => {
        let timer = null;
        if (practiceStep === 'THINKING' && thinkingSeconds > 0) {
          timer = setInterval(() => {
            setThinkingSeconds(prev => {
              if (prev <= 1) {
                clearInterval(timer);
                setPracticeStep('CHOOSE_DURATION');
                return 0;
              }
              return prev - 1;
            });
          }, 1000);
        }
        return () => { if (timer) clearInterval(timer); };
      }, [practiceStep, thinkingSeconds]);

      const startSpeakingSession = async (chosenDurationSec) => {
        setTargetDuration(chosenDurationSec);
        setElapsedSpeakingSeconds(0);
        setLiveTranscript('');
        setIsSpeakingPaused(false);
        setThinkingMomentsCount(0);
        setPracticeStep('SPEAKING');

        saveActiveSession({
          topic: currentTopic,
          targetDuration: chosenDurationSec,
          createdAt: new Date().toISOString()
        });

        try {
          const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
          micStreamRef.current = stream;
          setMicError(null);

          const AudioCtx = window.AudioContext || window.webkitAudioContext;
          if (AudioCtx) {
            const audioCtx = new AudioCtx();
            audioContextRef.current = audioCtx;
            const analyser = audioCtx.createAnalyser();
            analyser.fftSize = 64;
            analyserRef.current = analyser;
            const source = audioCtx.createMediaStreamSource(stream);
            source.connect(analyser);
            drawWaveform();
          }

          initSpeechRecognition();
        } catch (err) {
          setMicError("Kami tidak dapat mengakses mikrofon. Periksa izin mikrofon di browsermu.");
        }
      };

      const initSpeechRecognition = () => {
        const SpeechRec = window.SpeechRecognition || window.webkitSpeechRecognition;
        if (!SpeechRec) {
          setSpeechSupported(false);
          return;
        }

        try {
          const recognition = new SpeechRec();
          recognition.continuous = true;
          recognition.interimResults = true;
          recognition.lang = 'id-ID';

          recognition.onresult = (event) => {
            let interim = '';
            let final = '';
            for (let i = 0; i < event.results.length; i++) {
              const piece = event.results[i][0].transcript;
              if (event.results[i].isFinal) final += piece + ' ';
              else interim += piece;
            }
            setLiveTranscript((final + interim).trim());
            lastSpeechTimeRef.current = Date.now();
          };

          recognition.onend = () => {
            if (practiceStep === 'SPEAKING' && !isSpeakingPaused && micStreamRef.current) {
              try { recognition.start(); } catch (e) {}
            }
          };

          recognition.start();
          recognitionRef.current = recognition;
        } catch (err) {}
      };

      useEffect(() => {
        if (practiceStep === 'SPEAKING' && !isSpeakingPaused) {
          lastSpeechTimeRef.current = Date.now();
          thinkingTimerRef.current = setInterval(() => {
            const silence = (Date.now() - lastSpeechTimeRef.current) / 1000;
            if (silence > 3.2 && silence < 4.0) {
              setThinkingMomentsCount(prev => prev + 1);
            }
          }, 1000);
        } else {
          if (thinkingTimerRef.current) clearInterval(thinkingTimerRef.current);
        }
        return () => { if (thinkingTimerRef.current) clearInterval(thinkingTimerRef.current); };
      }, [practiceStep, isSpeakingPaused]);

      const drawWaveform = () => {
        if (!canvasRef.current || !analyserRef.current) return;
        const canvas = canvasRef.current;
        const ctx = canvas.getContext('2d');
        const analyser = analyserRef.current;
        const dataArray = new Uint8Array(analyser.frequencyBinCount);

        const render = () => {
          animationFrameRef.current = requestAnimationFrame(render);
          analyser.getByteFrequencyData(dataArray);

          ctx.clearRect(0, 0, canvas.width, canvas.height);
          const barCount = 20;
          const barWidth = 4;
          const gap = 6;
          const totalWidth = barCount * (barWidth + gap);
          let startX = (canvas.width - totalWidth) / 2;

          for (let i = 0; i < barCount; i++) {
            const val = dataArray[i % dataArray.length] || 0;
            let barHeight = isSpeakingPaused ? 4 : Math.max(4, (val / 255) * canvas.height * 0.85);
            const x = startX + i * (barWidth + gap);
            const y = (canvas.height - barHeight) / 2;

            ctx.fillStyle = isSpeakingPaused ? '#C4B5B8' : '#7A1E2C';
            ctx.beginPath();
            ctx.rect(x, y, barWidth, barHeight);
            ctx.fill();
          }
        };
        render();
      };

      useEffect(() => {
        let interval = null;
        if (practiceStep === 'SPEAKING' && !isSpeakingPaused) {
          interval = setInterval(() => {
            setElapsedSpeakingSeconds(prev => {
              const nextSec = prev + 1;
              if (nextSec >= targetDuration) {
                clearInterval(interval);
                finishSpeakingSession(nextSec);
                return targetDuration;
              }
              return nextSec;
            });
          }, 1000);
        }
        return () => { if (interval) clearInterval(interval); };
      }, [practiceStep, isSpeakingPaused, targetDuration]);

      const stopAudioResources = () => {
        if (animationFrameRef.current) cancelAnimationFrame(animationFrameRef.current);
        if (recognitionRef.current) {
          try { recognitionRef.current.stop(); } catch (e) {}
        }
        if (micStreamRef.current) {
          micStreamRef.current.getTracks().forEach(t => t.stop());
          micStreamRef.current = null;
        }
        if (audioContextRef.current && audioContextRef.current.state !== 'closed') {
          audioContextRef.current.close().catch(() => {});
        }
      };

      const togglePause = () => {
        if (isSpeakingPaused) {
          setIsSpeakingPaused(false);
          lastSpeechTimeRef.current = Date.now();
          if (recognitionRef.current) {
            try { recognitionRef.current.start(); } catch (e) {}
          }
        } else {
          setIsSpeakingPaused(true);
          if (recognitionRef.current) {
            try { recognitionRef.current.stop(); } catch (e) {}
          }
        }
      };

      const finishSpeakingSession = (finalSec = elapsedSpeakingSeconds) => {
        const actualSec = finalSec || elapsedSpeakingSeconds;
        stopAudioResources();

        const { total: fillerCount, breakdown: fillerDetails } = detectFillerWords(liveTranscript);
        const { fluencyScore, confidenceScore } = calculateMetrics(actualSec, targetDuration, fillerCount, thinkingMomentsCount, liveTranscript);
        const { feedback, nextFocus } = generateHumanFeedback(actualSec, targetDuration, fluencyScore, fillerCount, thinkingMomentsCount);

        const newRecord = {
          id: 'vokara_' + Date.now(),
          topic: currentTopic,
          targetDuration,
          actualDuration: actualSec,
          fluencyScore,
          fillerCount,
          fillerDetails,
          thinkingMoments: thinkingMomentsCount,
          confidenceScore,
          transcript: liveTranscript.trim() || 'Transkrip belum tersedia untuk latihan ini.',
          feedback,
          nextFocus,
          createdAt: new Date().toISOString()
        };

        const updated = [newRecord, ...history];
        handleUpdateHistory(updated);
        saveActiveSession(null);
        setActiveSessionNotice(null);

        setLatestResult(newRecord);
        setPracticeStep('RESULT');
      };

      const handleClearAllData = () => {
        localStorage.removeItem(STORAGE_KEYS.HISTORY);
        localStorage.removeItem(STORAGE_KEYS.USED_TOPICS);
        localStorage.removeItem(STORAGE_KEYS.ACTIVE_SESSION);
        setHistory([]);
        setUsedTopics([]);
        setActiveSessionNotice(null);
        setLatestResult(null);
        setShowDeleteModal(false);
        setCurrentTab('BERANDA');
        setPracticeStep('PREPARE');
      };

      return (
        <div className="min-h-screen flex flex-col">
          
          {/* Header */}
          <header className="sticky top-0 z-40 bg-[#F7F5F2]/90 backdrop-blur-md border-b border-[#E8E4DF]">
            <div className="max-w-5xl mx-auto px-4 sm:px-6 h-18 py-4 flex items-center justify-between">
              <button 
                onClick={() => { setCurrentTab('BERANDA'); setPracticeStep('PREPARE'); }}
                className="flex items-center gap-2 font-heading text-2xl font-extrabold tracking-tight text-[#7A1E2C]"
              >
                VOKARA
              </button>

              <nav className="hidden md:flex items-center gap-1 font-medium text-sm">
                {[
                  { id: 'BERANDA', label: 'Beranda' },
                  { id: 'LATIHAN', label: 'Latihan' },
                  { id: 'PERKEMBANGAN', label: 'Perkembangan' },
                  { id: 'RIWAYAT', label: 'Riwayat' }
                ].map(tab => (
                  <button
                    key={tab.id}
                    onClick={() => {
                      if (practiceStep === 'SPEAKING') stopAudioResources();
                      setCurrentTab(tab.id);
                      if (tab.id === 'LATIHAN' && practiceStep === 'RESULT') setPracticeStep('PREPARE');
                    }}
                    className={`px-4 py-2 rounded-lg transition-colors ${
                      currentTab === tab.id
                        ? 'text-[#7A1E2C] font-semibold bg-[#7A1E2C]/8'
                        : 'text-[#6B6B6B] hover:text-[#1C1C1C] hover:bg-black/5'
                    }`}
                  >
                    {tab.label}
                  </button>
                ))}
              </nav>

              <div className="hidden md:flex items-center gap-3">
                <button
                  onClick={() => {
                    if (practiceStep === 'SPEAKING') stopAudioResources();
                    setCurrentTab('LATIHAN');
                    setPracticeStep('PREPARE');
                  }}
                  className="bg-[#7A1E2C] hover:bg-[#631723] text-white px-5 py-2.5 rounded-lg text-sm font-medium transition-all shadow-sm"
                >
                  Mulai Latihan
                </button>
              </div>

              <div className="md:hidden">
                <button
                  onClick={() => setMobileMenuOpen(!mobileMenuOpen)}
                  className="p-2 text-[#1C1C1C]"
                >
                  <i data-lucide={mobileMenuOpen ? "x" : "menu"}></i>
                </button>
              </div>
            </div>

            {mobileMenuOpen && (
              <div className="md:hidden bg-[#F7F5F2] border-b border-[#E8E4DF] px-4 py-4 space-y-2">
                {[
                  { id: 'BERANDA', label: 'Beranda' },
                  { id: 'LATIHAN', label: 'Latihan' },
                  { id: 'PERKEMBANGAN', label: 'Perkembangan' },
                  { id: 'RIWAYAT', label: 'Riwayat' }
                ].map(tab => (
                  <button
                    key={tab.id}
                    onClick={() => {
                      if (practiceStep === 'SPEAKING') stopAudioResources();
                      setCurrentTab(tab.id);
                      setMobileMenuOpen(false);
                      if (tab.id === 'LATIHAN' && practiceStep === 'RESULT') setPracticeStep('PREPARE');
                    }}
                    className={`w-full text-left px-4 py-2 rounded-lg font-medium text-sm ${
                      currentTab === tab.id ? 'text-[#7A1E2C] bg-[#7A1E2C]/8 font-semibold' : 'text-[#6B6B6B]'
                    }`}
                  >
                    {tab.label}
                  </button>
                ))}
              </div>
            )}
          </header>

          {/* Active Session Notice */}
          {activeSessionNotice && currentTab !== 'LATIHAN' && (
            <div className="bg-[#7A1E2C] text-white px-4 py-3">
              <div className="max-w-5xl mx-auto flex flex-col sm:flex-row items-center justify-between gap-3 text-sm">
                <span><strong>Latihanmu belum selesai:</strong> Topik "{activeSessionNotice.topic}"</span>
                <div className="flex gap-2">
                  <button
                    onClick={() => {
                      setCurrentTab('LATIHAN');
                      setCurrentTopic(activeSessionNotice.topic);
                      setTargetDuration(activeSessionNotice.targetDuration);
                      setActiveSessionNotice(null);
                      startSpeakingSession(activeSessionNotice.targetDuration);
                    }}
                    className="bg-white text-[#7A1E2C] px-3 py-1 rounded text-xs font-semibold"
                  >
                    Lanjutkan
                  </button>
                  <button
                    onClick={() => {
                      saveActiveSession(null);
                      setActiveSessionNotice(null);
                    }}
                    className="text-white/80 hover:text-white text-xs px-2 py-1"
                  >
                    Akhiri
                  </button>
                </div>
              </div>
            </div>
          )}

          {/* Main Views */}
          <main className="flex-1 max-w-5xl w-full mx-auto px-4 sm:px-6 py-8 md:py-12">
            
            {/* BERANDA */}
            {currentTab === 'BERANDA' && (
              <div className="space-y-12">
                <div className="space-y-6 max-w-3xl">
                  <div className="inline-block px-3 py-1 rounded-full bg-[#7A1E2C]/10 text-[#7A1E2C] text-xs font-semibold uppercase">
                    Platform Latihan Spontan
                  </div>
                  <h1 className="font-heading text-3xl sm:text-5xl font-extrabold tracking-tight text-[#1C1C1C] leading-tight">
                    BICARA LEBIH BAIK.<br />
                    BERPIKIR LEBIH CEPAT.<br />
                    <span className="text-[#7A1E2C]">LEBIH PERCAYA DIRI.</span>
                  </h1>
                  <p className="text-[#6B6B6B] text-base sm:text-lg leading-relaxed">
                    Latih kemampuan berbicara secara spontan melalui topik acak, batas waktu terstruktur, dan evaluasi terukur yang membantu kamu berkembang dari satu latihan ke latihan berikutnya.
                  </p>
                  <div className="pt-2 flex flex-wrap gap-4">
                    <button
                      onClick={() => { setCurrentTab('LATIHAN'); setPracticeStep('PREPARE'); }}
                      className="bg-[#7A1E2C] hover:bg-[#631723] text-white px-7 py-3.5 rounded-xl font-semibold text-base transition-all"
                    >
                      MULAI LATIHAN
                    </button>
                    <button
                      onClick={() => setCurrentTab('RIWAYAT')}
                      className="border border-[#E8E4DF] bg-white text-[#1C1C1C] px-6 py-3.5 rounded-xl font-medium text-base"
                    >
                      Lihat Riwayat
                    </button>
                  </div>
                </div>

                <div className="border-t border-[#E8E4DF] pt-10 space-y-6">
                  <div className="flex justify-between items-end">
                    <div>
                      <h2 className="font-heading text-xl sm:text-2xl font-bold">SELAMAT DATANG, PEMBICARA.</h2>
                      <p className="text-[#6B6B6B] text-sm mt-1">Setiap kali kamu berbicara, kamu sedang melatih keberanianmu.</p>
                    </div>
                    {dashboardStats.totalPractices > 0 && (
                      <span className="text-xs font-semibold px-3 py-1 bg-white border border-[#E8E4DF] rounded-lg text-[#7A1E2C]">
                        {dashboardStats.level.name}
                      </span>
                    )}
                  </div>

                  <div className="grid grid-cols-2 sm:grid-cols-5 gap-3">
                    <div className="bg-white border border-[#E8E4DF] rounded-xl p-4">
                      <span className="text-xs font-semibold text-[#6B6B6B] uppercase">Total Latihan</span>
                      <div className="mt-2 text-2xl font-bold font-heading">{dashboardStats.totalPractices}</div>
                    </div>
                    <div className="bg-white border border-[#E8E4DF] rounded-xl p-4">
                      <span className="text-xs font-semibold text-[#6B6B6B] uppercase">Waktu Berbicara</span>
                      <div className="mt-2 text-2xl font-bold font-heading">{dashboardStats.totalMinutes} <span className="text-xs font-normal">menit</span></div>
                    </div>
                    <div className="bg-white border border-[#E8E4DF] rounded-xl p-4">
                      <span className="text-xs font-semibold text-[#6B6B6B] uppercase">Kelancaran</span>
                      <div className="mt-2 text-2xl font-bold font-heading">{dashboardStats.avgFluency}</div>
                    </div>
                    <div className="bg-white border border-[#E8E4DF] rounded-xl p-4">
                      <span className="text-xs font-semibold text-[#6B6B6B] uppercase">Kata Pengisi</span>
                      <div className="mt-2 text-2xl font-bold font-heading">{dashboardStats.avgFillers}</div>
                    </div>
                    <div className="col-span-2 sm:col-span-1 bg-white border border-[#E8E4DF] rounded-xl p-4">
                      <span className="text-xs font-semibold text-[#6B6B6B] uppercase">Kepercayaan Diri</span>
                      <div className="mt-2 text-2xl font-bold font-heading text-[#7A1E2C]">{dashboardStats.confidenceScore}</div>
                    </div>
                  </div>

                  {history.length === 0 ? (
                    <div className="bg-white border border-[#E8E4DF] rounded-2xl p-8 sm:p-12 text-center space-y-4">
                      <h3 className="font-heading text-lg font-bold">PERJALANANMU DIMULAI DI SINI.</h3>
                      <p className="text-sm text-[#6B6B6B]">Selesaikan latihan pertamamu untuk mulai melihat perkembanganmu.</p>
                      <button
                        onClick={() => { setCurrentTab('LATIHAN'); setPracticeStep('PREPARE'); }}
                        className="bg-[#7A1E2C] text-white px-6 py-2.5 rounded-lg text-sm font-medium"
                      >
                        MULAI LATIHAN
                      </button>
                    </div>
                  ) : null}
                </div>
              </div>
            )}

            {/* LATIHAN */}
            {currentTab === 'LATIHAN' && (
              <div className="max-w-2xl mx-auto">
                {practiceStep === 'PREPARE' && (
                  <div className="bg-white border border-[#E8E4DF] rounded-2xl p-8 sm:p-12 text-center space-y-6">
                    <span className="inline-block px-3 py-1 rounded-full bg-[#7A1E2C]/8 text-[#7A1E2C] text-xs font-semibold uppercase">
                      Sesi Latihan Spontan
                    </span>
                    <h2 className="font-heading text-2xl sm:text-3xl font-extrabold">SIAP?</h2>
                    <p className="text-[#6B6B6B] text-base">
                      Kamu tidak akan tahu apa yang akan muncul. Berpikirlah spontan dan gunakan kata-katamu sendiri.
                    </p>
                    <button
                      onClick={startTopicShuffle}
                      className="bg-[#7A1E2C] hover:bg-[#631723] text-white px-8 py-4 rounded-xl font-semibold text-base"
                    >
                      MULAI ACAK
                    </button>
                  </div>
                )}

                {practiceStep === 'SHUFFLING' && (
                  <div className="bg-white border border-[#E8E4DF] rounded-2xl p-12 text-center space-y-6">
                    <span className="text-xs font-semibold text-[#6B6B6B] uppercase">Mengocok Topik Spontan</span>
                    <div className="py-8 font-heading text-2xl sm:text-3xl font-extrabold text-[#7A1E2C]">
                      {shuffleText}
                    </div>
                  </div>
                )}

                {practiceStep === 'THINKING' && (
                  <div className="bg-white border border-[#E8E4DF] rounded-2xl p-8 sm:p-12 text-center space-y-8">
                    <div>
                      <span className="text-xs font-semibold text-[#6B6B6B] uppercase">Topik yang Muncul</span>
                      <h2 className="font-heading text-2xl sm:text-4xl font-extrabold text-[#7A1E2C] mt-2">{currentTopic}</h2>
                    </div>
                    <div className="py-4 space-y-2">
                      <div className="text-5xl font-extrabold font-heading">{thinkingSeconds}</div>
                      <p className="text-sm text-[#6B6B6B]">Kamu punya 30 detik untuk menyusun pikiran. Mikrofon belum aktif.</p>
                    </div>
                    <button
                      onClick={() => { setThinkingSeconds(0); setPracticeStep('CHOOSE_DURATION'); }}
                      className="text-xs text-[#6B6B6B] border border-[#E8E4DF] px-4 py-2 rounded-lg"
                    >
                      Lewati Waktu Berpikir
                    </button>
                  </div>
                )}

                {practiceStep === 'CHOOSE_DURATION' && (
                  <div className="bg-white border border-[#E8E4DF] rounded-2xl p-8 sm:p-12 text-center space-y-8">
                    <h3 className="font-heading text-xl font-bold text-[#7A1E2C]">"{currentTopic}"</h3>
                    <div className="space-y-4">
                      <h4 className="font-heading font-bold text-lg">BERAPA LAMA KAMU SIAP BERBICARA?</h4>
                      <div className="grid grid-cols-2 sm:grid-cols-4 gap-3">
                        {[{ sec: 60, l: "1 MENIT" }, { sec: 120, l: "2 MENIT" }, { sec: 180, l: "3 MENIT" }, { sec: 300, l: "5 MENIT" }].map(opt => (
                          <button
                            key={opt.sec}
                            onClick={() => startSpeakingSession(opt.sec)}
                            className="p-4 rounded-xl border border-[#E8E4DF] hover:border-[#7A1E2C] font-heading font-extrabold"
                          >
                            {opt.l}
                          </button>
                        ))}
                      </div>
                    </div>
                  </div>
                )}

                {practiceStep === 'SPEAKING' && (
                  <div className="bg-white border border-[#E8E4DF] rounded-2xl p-8 sm:p-12 text-center space-y-8">
                    <div>
                      <span className="text-xs font-semibold text-[#6B6B6B] uppercase">Topik</span>
                      <h2 className="font-heading text-2xl font-extrabold text-[#7A1E2C]">{currentTopic}</h2>
                    </div>
                    <div className="text-6xl font-extrabold font-heading">
                      {formatSeconds(targetDuration - elapsedSpeakingSeconds)}
                    </div>
                    <div className="h-16 flex items-center justify-center">
                      <canvas ref={canvasRef} width={300} height={60} className="w-full max-w-xs h-12"></canvas>
                    </div>
                    {micError && <p className="text-xs text-rose-700 bg-rose-50 p-2 rounded">{micError}</p>}
                    <div className="flex justify-center gap-4">
                      <button
                        onClick={togglePause}
                        className="px-6 py-3 border border-[#E8E4DF] rounded-xl font-semibold text-sm"
                      >
                        {isSpeakingPaused ? 'LANJUTKAN' : 'JEDA'}
                      </button>
                      <button
                        onClick={() => finishSpeakingSession()}
                        className="px-6 py-3 bg-[#7A1E2C] text-white rounded-xl font-semibold text-sm"
                      >
                        SELESAIKAN
                      </button>
                    </div>
                  </div>
                )}

                {practiceStep === 'RESULT' && latestResult && (
                  <div className="bg-white border border-[#E8E4DF] rounded-2xl p-6 sm:p-10 space-y-6">
                    <div className="text-center border-b border-[#E8E4DF] pb-4">
                      <h2 className="font-heading text-2xl font-extrabold">SELESAI.</h2>
                      <p className="text-sm text-[#6B6B6B]">Satu latihan lagi selesai. Mari lihat perkembanganmu.</p>
                    </div>
                    <div className="grid grid-cols-2 sm:grid-cols-3 gap-3">
                      <div className="p-3 bg-[#F7F5F2] rounded-lg">
                        <span className="text-[11px] text-[#6B6B6B] block">Waktu Berbicara</span>
                        <span className="font-bold text-sm">{formatDurationText(latestResult.actualDuration)}</span>
                      </div>
                      <div className="p-3 bg-[#F7F5F2] rounded-lg">
                        <span className="text-[11px] text-[#6B6B6B] block">Kelancaran</span>
                        <span className="font-bold text-sm">{latestResult.fluencyScore}%</span>
                      </div>
                      <div className="p-3 bg-[#F7F5F2] rounded-lg">
                        <span className="text-[11px] text-[#6B6B6B] block">Kata Pengisi</span>
                        <span className="font-bold text-sm">{latestResult.fillerCount}</span>
                      </div>
                    </div>
                    <div className="p-4 bg-white border border-[#E8E4DF] rounded-xl">
                      <span className="text-xs font-semibold text-[#7A1E2C] uppercase block">Evaluasi</span>
                      <p className="text-xs text-[#1C1C1C] mt-1">{latestResult.feedback}</p>
                    </div>
                    <div className="p-4 bg-[#7A1E2C]/5 rounded-xl border border-[#7A1E2C]/15">
                      <span className="text-xs font-semibold text-[#7A1E2C] uppercase block">LATIHAN BERIKUTNYA</span>
                      <p className="text-xs text-[#1C1C1C] mt-1">{latestResult.nextFocus}</p>
                    </div>
                    <div className="space-y-1">
                      <span className="text-xs font-semibold text-[#6B6B6B] uppercase block">Transkrip Ucapanmu</span>
                      <div className="p-3 bg-[#F7F5F2] rounded-lg text-xs max-h-36 overflow-y-auto">{latestResult.transcript}</div>
                    </div>
                    <button
                      onClick={() => setPracticeStep('PREPARE')}
                      className="w-full bg-[#7A1E2C] text-white py-3 rounded-xl font-semibold text-sm"
                    >
                      LATIHAN LAGI
                    </button>
                  </div>
                )}
              </div>
            )}

            {/* PERKEMBANGAN */}
            {currentTab === 'PERKEMBANGAN' && (
              <div className="space-y-6">
                <h2 className="font-heading text-2xl font-extrabold">PERKEMBANGANMU</h2>
                {history.length === 0 ? (
                  <p className="text-sm text-[#6B6B6B]">Belum ada data perkembangan. Selesaikan latihan pertamamu.</p>
                ) : (
                  <div className="space-y-6">
                    <div className="bg-white border border-[#E8E4DF] rounded-xl p-5">
                      <span className="text-xs font-semibold text-[#6B6B6B] uppercase">Level Saat Ini</span>
                      <h3 className="font-heading text-xl font-bold text-[#7A1E2C]">{dashboardStats.level.name}</h3>
                    </div>
                    <div className="bg-white border border-[#E8E4DF] rounded-xl p-5 space-y-4">
                      <h4 className="font-heading font-bold text-sm">TREN KELANCARAN (%)</h4>
                      <div className="h-36 flex items-end gap-2 border-b border-[#E8E4DF] pb-2">
                        {history.slice(0, 10).reverse().map((item, idx) => (
                          <div key={idx} className="flex-1 flex flex-col items-center">
                            <div className="w-full bg-[#7A1E2C] rounded-t" style={{ height: `${item.fluencyScore}%` }}></div>
                            <span className="text-[10px] text-[#6B6B6B] mt-1">{item.fluencyScore}%</span>
                          </div>
                        ))}
                      </div>
                    </div>
                    <button
                      onClick={() => setShowDeleteModal(true)}
                      className="text-xs font-semibold text-rose-700 p-2"
                    >
                      HAPUS SEMUA DATA
                    </button>
                  </div>
                )}
              </div>
            )}

            {/* RIWAYAT */}
            {currentTab === 'RIWAYAT' && (
              <div className="space-y-4">
                <h2 className="font-heading text-2xl font-extrabold">RIWAYAT LATIHAN</h2>
                {history.length === 0 ? (
                  <p className="text-sm text-[#6B6B6B]">Belum ada riwayat latihan.</p>
                ) : (
                  <div className="space-y-3">
                    {history.map(item => (
                      <div
                        key={item.id}
                        onClick={() => setSelectedHistoryItem(item)}
                        className="bg-white border border-[#E8E4DF] rounded-xl p-4 cursor-pointer hover:border-[#7A1E2C]"
                      >
                        <h4 className="font-heading font-bold text-sm text-[#7A1E2C]">{item.topic}</h4>
                        <div className="text-xs text-[#6B6B6B] mt-1 flex gap-3">
                          <span>{formatDurationText(item.actualDuration)}</span>
                          <span>• Kelancaran {item.fluencyScore}%</span>
                          <span>• {formatDateText(item.createdAt)}</span>
                        </div>
                      </div>
                    ))}
                  </div>
                )}
              </div>
            )}
          </main>

          {/* History Detail Modal */}
          {selectedHistoryItem && (
            <div className="fixed inset-0 z-50 bg-black/40 flex items-center justify-center p-4">
              <div className="bg-white rounded-2xl max-w-lg w-full p-6 space-y-4">
                <h3 className="font-heading font-bold text-lg text-[#7A1E2C]">{selectedHistoryItem.topic}</h3>
                <div className="text-xs text-[#6B6B6B]">{formatDateText(selectedHistoryItem.createdAt)}</div>
                <div className="p-3 bg-[#F7F5F2] rounded text-xs">{selectedHistoryItem.transcript}</div>
                <button
                  onClick={() => setSelectedHistoryItem(null)}
                  className="w-full bg-[#1C1C1C] text-white py-2 rounded-lg text-xs"
                >
                  Tutup
                </button>
              </div>
            </div>
          )}

          {/* Delete Confirmation Modal */}
          {showDeleteModal && (
            <div className="fixed inset-0 z-50 bg-black/40 flex items-center justify-center p-4">
              <div className="bg-white rounded-2xl max-w-sm w-full p-6 space-y-4">
                <h3 className="font-heading font-bold text-lg">HAPUS SEMUA DATA?</h3>
                <p className="text-xs text-[#6B6B6B]">Apakah kamu yakin? Seluruh riwayat latihan akan dihapus permanen.</p>
                <div className="flex gap-2">
                  <button onClick={handleClearAllData} className="flex-1 bg-rose-700 text-white py-2 rounded-lg text-xs">HAPUS DATA</button>
                  <button onClick={() => setShowDeleteModal(false)} className="flex-1 border py-2 rounded-lg text-xs">BATAL</button>
                </div>
              </div>
            </div>
          )}

          {/* Footer */}
          <footer className="border-t border-[#E8E4DF] bg-[#F7F5F2] py-6 text-xs text-[#6B6B6B] text-center">
            <div className="max-w-5xl mx-auto px-4">
              Data latihan disimpan secara lokal di browser ini. VOKARA tidak memerlukan akun untuk digunakan.
            </div>
          </footer>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
